name: build-win
on:
  workflow_dispatch: {}
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run predist

      - run: npx electron-builder --win --x64 --publish=never
        env:
          DEBUG: electron-builder

      - uses: actions/upload-artifact@v4
        with:
          name: karatin-win
          path: dist/*.exe
          if-no-files-found: error
